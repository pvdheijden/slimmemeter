[program:prometheus]
directory = /opt/prometheus
# Keep the energy history for 10 years, or until it takes 4 GB of the SD card, whichever comes first
command = /opt/prometheus/prometheus --config.file=prometheus.yml --web.enable-admin-api --storage.tsdb.retention.time=10y --storage.tsdb.retention.size=4GB
autorestart = true
stopsignal = TERM
stdout_logfile = /var/log/prometheus.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 10
redirect_stderr = true
